[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kspace-transformer"
version = "0.1.0"
description = "Ground up built K-Space Transformer MRI reconstruction pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=2.1,<3.0",
    "torch>=2.2,<3.0",
    "h5py>=3.10,<4.0",
    "scikit-image>=0.22,<1.0",
    "tensorboard>=2.15,<3.0",
    "tqdm>=4.66,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1,<9.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
]

[project.scripts]
kst-train = "cli.train:main_train"
kst-test = "cli.test:main_test"
kst-preprocess = "cli.preprocess:main_preprocess"
kst-split = "cli.split:main_split"
kst-parity = "cli.parity:main_parity"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
addopts = "-q -ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

